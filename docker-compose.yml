# Контейнеры живут постоянно (sleep): exec — доли секунды, создание контейнера на сервере — десятки секунд.
x-common: &common
  command: ["sleep", "infinity"]
  init: true
  volumes:
    - .:/app
  working_dir: /app
  user: "${UID:-1000}:${GID:-1000}"
  environment:
    HOME: /tmp
    COMPOSER_HOME: /app/.cache/composer-home
    COMPOSER_CACHE_DIR: /app/.cache/composer

services:
  composer:
    <<: *common
    image: composer:2

  php81:
    <<: *common
    image: php:8.1-cli

  php84:
    <<: *common
    image: php:8.4-cli
